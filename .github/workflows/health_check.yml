name: Automated System Health Check

on:
  schedule:
    # Runs daily at midnight UTC (adjust cron schedule as needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manually triggering the health check from GitHub UI

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Agent Health Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_health_check.py

      - name: Commit and Push Updated Health Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add HEALTH_CHECK.md
          git commit -m "Automated health check update" || echo "No changes to commit"
          git push